<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <title>تواصل | نماء</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <canvas id="canvas-bg"></canvas>
    <div class="preloader"><div class="spinner"></div></div>

    <div class="container" style="padding-top: 160px; padding-bottom: 80px;">
        <h1 class="section-title">دعنا <span>نتحدث</span></h1>
        <div class="contact-wrapper">
            <div class="contact-info">
                <h2 style="color:white; margin-bottom:20px;">بيانات الاتصال</h2>
                <p style="color:var(--text-muted); margin-bottom:40px;">فريقنا جاهز للرد على استفساراتك.</p>
                <div style="margin-bottom:20px; color:var(--text-muted);"><i class="fas fa-phone" style="color:var(--primary); margin-left:10px;"></i> 01000000000</div>
                <div style="margin-bottom:20px; color:var(--text-muted);"><i class="fas fa-envelope" style="color:var(--primary); margin-left:10px;"></i> info@namaa.com</div>
            </div>
            <div class="contact-form">
                <form>
                    <input type="text" class="form-input" placeholder="الاسم">
                    <input type="tel" class="form-input" placeholder="الهاتف">
                    <textarea class="form-input" rows="5" placeholder="الرسالة"></textarea>
                    <button class="btn-glow" style="width:100%;">إرسال</button>
                </form>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
