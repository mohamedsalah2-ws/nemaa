<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نماء للأسمدة | تواصل معنا</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <nav class="navbar">
        <div class="container nav-content">
            <a href="index.html" class="logo"><i class="fas fa-leaf text-green-600"></i> نماء</a>
            <ul class="nav-links" id="navLinks">
                <li><a href="index.html">الرئيسية</a></li>
                <li><a href="products.html">منتجاتنا</a></li>
                <li><a href="contact.html" class="active">تواصل معنا</a></li>
            </ul>
            <div class="menu-toggle" id="menuToggle"><i class="fas fa-bars"></i></div>
        </div>
    </nav>

    <section class="section">
        <div class="container">
            <h2 class="section-title">تواصل معنا</h2>
            <div class="grid-3">
                <div class="card reveal">
                    <div class="icon-box"><i class="fas fa-phone"></i></div>
                    <h3>اتصل بنا</h3>
                    <p>01000000000</p>
                </div>
                <div class="card reveal">
                    <div class="icon-box"><i class="fas fa-envelope"></i></div>
                    <h3>البريد الإلكتروني</h3>
                    <p>info@namaa.com</p>
                </div>
                <div class="card reveal">
                    <div class="icon-box"><i class="fas fa-map-marker-alt"></i></div>
                    <h3>العنوان</h3>
                    <p>القاهرة، مصر</p>
                </div>
            </div>

            <div class="card reveal" style="max-width:600px; margin: 40px auto; text-align: right;">
                <h3 style="margin-bottom:20px; text-align:center;">أرسل رسالة</h3>
                <form style="display:flex; flex-direction:column; gap:15px;">
                    <input type="text" placeholder="الاسم" style="padding:12px; border:1px solid #ddd; border-radius:8px;">
                    <input type="tel" placeholder="رقم الهاتف" style="padding:12px; border:1px solid #ddd; border-radius:8px;">
                    <textarea rows="4" placeholder="الرسالة" style="padding:12px; border:1px solid #ddd; border-radius:8px;"></textarea>
                    <button class="btn-main" style="border:none; cursor:pointer;">إرسال</button>
                </form>
            </div>
        </div>
    </section>

    <footer>
        <div class="container"><p>© 2025 نماء للأسمدة الزراعية.</p></div>
    </footer>
    <script src="script.js"></script>
</body>
</html>
