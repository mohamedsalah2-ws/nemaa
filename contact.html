<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <title>تواصل | نماء</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <canvas id="canvas-bg"></canvas>
    <nav class="navbar desktop-only">
        <div class="nav-content">
            <a href="index.html" class="logo"><i class="fas fa-leaf"></i> نماء</a>
            <ul class="nav-links">
                <li><a href="index.html">الرئيسية</a></li>
                <li><a href="products.html">المتجر</a></li>
                <li><a href="contact.html" class="active">اتصل بنا</a></li>
            </ul>
        </div>
    </nav>

    <div class="container" style="padding-top: 150px;">
        <h1 class="section-title">تواصل <span>معنا</span></h1>
        <div class="contact-wrapper">
            <div class="contact-info">
                <h2 style="color:white; margin-bottom:20px;">بيانات الاتصال</h2>
                <p style="color:var(--text-muted); margin-bottom:30px;">فريقنا جاهز للرد على استفساراتك.</p>
                <div style="margin-bottom:20px; color:var(--text-muted);"><i class="fas fa-phone" style="color:var(--primary); margin-left:10px;"></i> 01000000000</div>
                <div style="margin-bottom:20px; color:var(--text-muted);"><i class="fas fa-envelope" style="color:var(--primary); margin-left:10px;"></i> info@namaa.com</div>
            </div>
            <div class="contact-form">
                <form>
                    <input type="text" class="form-input" placeholder="الاسم">
                    <input type="tel" class="form-input" placeholder="الهاتف">
                    <textarea class="form-input" rows="5" placeholder="الرسالة"></textarea>
                    <button class="btn-glow" style="width:100%;">إرسال</button>
                </form>
            </div>
        </div>
    </div>

    <div class="mobile-nav">
        <a href="index.html" class="m-item"><i class="fas fa-home"></i></a>
        <a href="products.html" class="m-item"><i class="fas fa-box"></i></a>
        <div class="m-center"><a href="tel:01000000000" style="color:black;"><i class="fas fa-phone"></i></a></div>
        <a href="contact.html" class="m-item active"><i class="fas fa-envelope"></i></a>
    </div>
    <script src="script.js"></script>
</body>
</html>
