<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <title>المتجر | نماء</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <canvas id="canvas-bg"></canvas>
    <div class="preloader"><div class="loader-logo"><i class="fas fa-leaf"></i> نماء</div><div class="spinner"></div></div>

    <div class="container" style="padding-top: 150px; padding-bottom: 80px;">
        <h1 class="section-title">جميع <span>المنتجات</span></h1>
        
        <div class="filter-container">
            <button class="filter-btn active" data-filter="all">الكل</button>
            <button class="filter-btn" data-filter="growth">نمو خضري</button>
            <button class="filter-btn" data-filter="roots">جذور</button>
            <button class="filter-btn" data-filter="fruit">إثمار</button>
            <button class="filter-btn" data-filter="elements">عناصر</button>
        </div>

        <div class="products-grid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 30px;">
            </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
